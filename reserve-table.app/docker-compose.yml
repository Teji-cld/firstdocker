version: "3.8"

services:
  localstack:
    # Pinned below LocalStack's March 2026 image consolidation — newer tags
    # (2026.x, latest, stable) now require a free LocalStack auth token just
    # to start the container. This tag still runs with zero signup, which is
    # all a first Docker exercise needs. Nothing wrong with your setup if you
    # see other tutorials use `latest` — they predate this change.
    image: localstack/localstack:4.14.0
    container_name: amber-table-localstack
    ports:
      - "127.0.0.1:4566:4566"   # single edge port — every service goes through here
    environment:
      - SERVICES=sqs,dynamodb,events
      - DEBUG=1
      - PERSISTENCE=1            # keep data across `docker compose restart`
    volumes:
      - "./localstack-data:/var/lib/localstack"
