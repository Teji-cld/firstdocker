<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Shop</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
  .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 0 8px rgba(0,0,0,0.1); }
  .card h3 { margin: 0 0 5px 0; }
  .price { color: #2e7d32; font-weight: bold; }
  button { padding: 8px 12px; cursor: pointer; }
</style>
</head>
<body>
  <header>
    <h2>📚 Welcome, <span id="who"></span></h2>
    <button onclick="logout()">Logout</button>
  </header>

  <div class="grid" id="books"></div>

  <script>
    const BOOK_URL = `http://${window.location.hostname}:5002`;
    const username = localStorage.getItem("username");

    if (!username) {
      window.location.href = "login.html";
    }
    document.getElementById("who").innerText = username;

    async function loadBooks() {
      const res = await fetch(`${BOOK_URL}/books`);
      const books = await res.json();
      const container = document.getElementById("books");
      container.innerHTML = "";
      books.forEach(book => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h3>${book.title}</h3>
          <p>by ${book.author}</p>
          <p class="price">$${book.price.toFixed(2)}</p>
        `;
        container.appendChild(card);
      });
    }

    function logout() {
      localStorage.removeItem("username");
      window.location.href = "login.html";
    }

    loadBooks();
  </script>
</body>
</html>
